name: validate

on:
  pull_request:
  push:
    branches: [main, next]
  merge_group:

jobs:
  validate:
    # The ruleset requires `validate` alone, and a skipped job satisfies it.
    # So this job runs even when a document job fails, and fails with it.
    needs: [docs, agents]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the document jobs
        if: needs.docs.result != 'success' || needs.agents.result != 'success'
        run: exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet, build and test
        run: |
          go vet ./...
          go build ./...
          go test ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install the CLI
        run: bun install --frozen-lockfile

      - name: Type check the CLI
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Test the CLI
        run: bun test

  # The document standard, from the one checker in aivara-se/.github. This
  # repository carries no copy of it.
  docs:
    permissions:
      contents: read
    uses: aivara-se/.github/.github/workflows/validate-docs.yml@main

  # The organisation's entry file, from the same standard. A copy that drifts
  # fails here.
  agents:
    permissions:
      contents: read
    uses: aivara-se/.github/.github/workflows/validate-agents.yml@main
