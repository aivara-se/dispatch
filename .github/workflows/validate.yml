name: validate

on:
  pull_request:
  merge_group:

jobs:
  validate-agents:
    uses: aivara-se/.github/.github/workflows/validate-agents.yml@main

  validate-docs:
    uses: aivara-se/.github/.github/workflows/validate-docs.yml@main

  validate-config:
    uses: aivara-se/.github/.github/workflows/validate-config.yml@main
    secrets:
      ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}

  validate:
    # The ruleset requires `validate` alone, and a skipped job satisfies it.
    # So this job runs even when an organisation job fails, and fails with it.
    needs: [validate-agents, validate-docs, validate-config]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the organisation jobs
        if: needs.validate-agents.result != 'success' || needs.validate-docs.result != 'success' || needs.validate-config.result != 'success'
        run: exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet, build and test
        run: |
          go vet ./...
          go build ./...
          go test ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun fmt --no-script --check .

      - name: Type check the CLI
        run: bun x tsc -p tsconfig.json --noEmit

      - name: Test the CLI
        run: bun test cli

      - name: Build the web client
        working-directory: web
        run: bun run build

      - name: Check the web client
        working-directory: web
        run: bun run check

      - name: Test the web client
        working-directory: web
        run: bun test
